<!DOCTYPE html>
<html>
<head>
    <title>Todo List</title>
</head>
<body>
    <h1>My Todo List</h1>
    <form method="POST">
        <input type="text" name="todo" placeholder="Add a new todo">
        <button type="submit">Add Todo</button>
    </form>
    <ol>
        {% for todo in todos %}
        <li>{{ todo.text }}</li>
        {% if todo.completed==True %}
            <p>Completed!</p>
            <a href="/completed/{{ loop.index0 }}">Undo</a>
        {% else %}
        <a href="/completed/{{ loop.index0 }}">Complete</a>
        {% endif %}
        <a href="/delete/{{  loop.index0  }}">Delete</a>
        {% endfor %}
    </ol>
</body>
</html>
